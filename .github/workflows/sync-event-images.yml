name: Sync event images from Beaune Tourisme

on:
  workflow_dispatch:
  schedule:
    # Independent Wednesday recovery checks (UTC).
    - cron: '30 9,11,13 * * 3'
  push:
    branches: [main]
    paths:
      - "docs/feed.xml"
      - "docs/index.html"
      - "docs/history.json"
      - "docs/test-affiches/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow
      - name: Check whether scheduled recovery is necessary
        id: recovery
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] && timeout 90s python -c "from scripts.validate_agenda import validate; validate(published=True)"; then
            echo "sync_needed=false" >> "$GITHUB_OUTPUT"
            if [ -d docs/test-affiches ] && ! timeout 60s python -c "from scripts.validate_test_preview import validate_public; validate_public()"; then
              echo "needed=true" >> "$GITHUB_OUTPUT"
              echo "Production is correct; deploying only to publish the separate test preview."
            else
              echo "needed=false" >> "$GITHUB_OUTPUT"
              echo "Public edition is already correct; no redeployment."
            fi
          else
            echo "sync_needed=true" >> "$GITHUB_OUTPUT"
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate complete edition before synchronization
        if: steps.recovery.outputs.sync_needed == 'true'
        run: python scripts/validate_agenda.py
      - name: Pull exact images from Beaune Tourisme event pages
        if: steps.recovery.outputs.sync_needed == 'true'
        run: python scripts/sync_event_images.py
      - name: Validate six synchronized images
        if: steps.recovery.outputs.sync_needed == 'true'
        run: python scripts/validate_agenda.py --local-images
      - name: Commit synchronized edition without overwriting concurrent changes
        if: steps.recovery.outputs.sync_needed == 'true'
        shell: bash
        run: |
          git config user.name "OfficedeTourismeBeaune"
          git config user.email "clement.besnard@beaune-tourisme.fr"
          git add docs/feed.xml docs/index.html docs/assets/events
          if ! git diff --cached --quiet; then
            git commit -m "agenda: synchronize exact event images"
          fi
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            git merge-base --is-ancestor origin/main HEAD || {
              echo "A newer edition arrived; refusing to publish a stale checkout."
              exit 1
            }
            git push origin HEAD:main
          fi
      - name: Validate separate test preview locally
        if: steps.recovery.outputs.needed == 'true'
        run: python scripts/validate_test_preview.py --local
      - uses: actions/configure-pages@v5
        if: steps.recovery.outputs.needed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.recovery.outputs.needed == 'true'
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./docs
      - name: Wait until the uploaded Pages artifact is visible
        if: steps.recovery.outputs.needed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100"); then
              count=$(jq --arg name "$ARTIFACT_NAME" '[.artifacts[] | select(.name == $name and .expired == false)] | length' <<< "$artifacts")
              if [ "$count" = "1" ]; then
                echo "Confirmed unique artifact: $ARTIFACT_NAME"
                sleep 10
                exit 0
              fi
            fi
            echo "Waiting for artifact metadata (attempt $attempt/18)"
            sleep 5
          done
          echo "::error::Pages artifact did not become available."
          exit 1
      - name: Deploy complete synchronized agenda
        if: steps.recovery.outputs.needed == 'true'
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Pause before retrying Pages deployment
        if: steps.recovery.outputs.needed == 'true' && steps.deployment.outcome == 'failure'
        shell: bash
        run: sleep 30
      - name: Retry Pages deployment
        if: steps.recovery.outputs.needed == 'true' && steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify public RSS, preview and all six images
        if: steps.recovery.outputs.needed == 'true'
        run: |
          python scripts/validate_agenda.py --published
          python scripts/validate_test_preview.py --published

