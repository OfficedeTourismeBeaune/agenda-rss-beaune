name: Sync event images from Beaune Tourisme

on:
  workflow_dispatch:
  push:
    paths:
      - "docs/history.json"
      - "scripts/sync_event_images.py"
      - ".github/workflows/sync-event-images.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-event-images
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image extractor dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow

      - name: Pull exact images from Beaune Tourisme event pages
        run: python scripts/sync_event_images.py

      - name: Commit synchronized images and feed
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain docs/assets/events)" ]; then
            echo "No image changes."
          else
            git config user.name "OfficedeTourismeBeaune"
            git config user.email "clement.besnard@beaune-tourisme.fr"
            git add docs/feed.xml docs/index.html docs/assets/events
            git commit -m "agenda: sync exact event images from Beaune Tourisme"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy synchronized agenda to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
