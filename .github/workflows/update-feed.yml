name: Publier l'agenda RSS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "docs/feed.xml"
      - "docs/index.html"
      - "docs/history.json"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer les fichiers Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Publier le flux
        id: deployment
        uses: actions/deploy-pages@v4
